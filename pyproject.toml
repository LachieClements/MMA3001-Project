[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mma3001-airfoil-noise"
version = "0.1.0"
description = "Grouped validation of airfoil self-noise prediction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Lachlan Clements"}]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.7,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pdoc>=15,<17"]

[project.scripts]
airfoil-noise = "airfoil_noise.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

